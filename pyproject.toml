[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensor-brain"
version = "0.1.0"
description = "A minimal, paper-readable implementation of the Tensor Brain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jaxtyping>=0.3",
  "torch==2.7.1",
]

[project.optional-dependencies]
pvsg = [
  "av>=14",
  "numpy>=1.26",
  "pillow>=10",
  "torchvision==0.22.1",
  "transformers==5.14.1",
]
agency = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]
dev = [
  "beartype>=0.19",
  "pytest>=8",
  "ruff>=0.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tb"]

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=tb,beartype.beartype"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["F722"] # Jaxtyping shape strings are not Python forward references.
